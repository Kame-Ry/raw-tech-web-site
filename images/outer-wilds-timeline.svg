<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Stylised orrery of the Outer Wilds solar system against deep space">
  <defs>
    <radialGradient id="ground" cx="0.42" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#191428"/>
      <stop offset="1" stop-color="#08070F"/>
    </radialGradient>
    <radialGradient id="sun">
      <stop offset="0" stop-color="#FFF3CE"/>
      <stop offset="0.5" stop-color="#FFC24A"/>
      <stop offset="1" stop-color="#E85F1E"/>
    </radialGradient>
    <radialGradient id="corona">
      <stop offset="0.45" stop-color="#FFB03A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF7A2A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eye">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.34" stop-color="#9FE6F5"/>
      <stop offset="1" stop-color="#2E6C8A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hearth" cx="0.37" cy="0.32">

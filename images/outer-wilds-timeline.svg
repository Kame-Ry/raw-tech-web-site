    <circle cx="-30" cy="-30" r="12" fill="url(#ash)"/>
    <circle cx="118" cy="-58" r="20" fill="url(#hearth)"/>
    <circle cx="139" cy="-77" r="5" fill="#8D8577"/>
    <circle cx="-150" cy="113" r="23" fill="url(#hollow)"/>

    <circle cx="332" cy="128" r="1.2" opacity=".6"/><circle cx="150" cy="238" r="1" opacity=".45"/>
    <circle cx="62" cy="405" r="1.4" opacity=".6"/><circle cx="196" cy="520" r="1" opacity=".5"/>
    <circle cx="358" cy="576" r="1.3" opacity=".55"/><circle cx="472" cy="66" r="1" opacity=".45"/>
    <circle cx="604" cy="42" r="1.5" opacity=".65"/><circle cx="742" cy="120" r="1" opacity=".5"/>
    <circle cx="880" cy="58" r="1.2" opacity=".55"/><circle cx="1024" cy="104" r="1" opacity=".45"/>
    <circle cx="1136" cy="196" r="1.4" opacity=".6"/><circle cx="1078" cy="470" r="1" opacity=".5"/>
    <circle cx="956" cy="566" r="1.3" opacity=".55"/><circle cx="820" cy="602" r="1" opacity=".4"/>
    <circle cx="668" cy="560" r="1.2" opacity=".5"/><circle cx="520" cy="606" r="1" opacity=".45"/>
    <circle cx="292" cy="352" r="1" opacity=".4"/><circle cx="1160" cy="360" r="1" opacity=".4"/>
